[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-whatsapp-data-lookup"
version = "0.1.0"
description = "Python client for WhatsApp Number Lookup on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "whatsapp", "data", "lookup"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/whatsapp-data-lookup"
Source = "https://github.com/apivault-labs/whatsapp-data-lookup-python"
Documentation = "https://github.com/apivault-labs/whatsapp-data-lookup-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_whatsapp_data_lookup*"]
